plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.studentdiscounts'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories { mavenCentral() }

configurations { javaFormatter }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    javaFormatter 'com.google.googlejavaformat:google-java-format:2.0.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }
bootJar { archiveFileName = 'catalog-service.jar' }

['javaFormat', 'javaFormatCheck'].each { taskName ->
    tasks.register(taskName, JavaExec) {
        classpath = configurations.javaFormatter
        mainClass = 'com.google.googlejavaformat.java.Main'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        jvmArgs = ['api', 'file', 'parser', 'tree', 'util', 'code'].collect {
            "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED"
        }
        doFirst {
            args = taskName == 'javaFormat' ? ['--replace'] : ['--dry-run', '--set-exit-if-changed']
            args += sourceSets.collectMany { it.allJava.files }.collect { it.absolutePath }.sort()
        }
    }
}

check { dependsOn 'javaFormatCheck' }
